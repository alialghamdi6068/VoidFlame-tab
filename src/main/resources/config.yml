# VoidFlame-TAB | SMP scoreboard and player list
# Paper 26.2 / Java 25. Data is read from VoidFlame-Core's shared SQLite database.
settings:
  update-interval-ticks: 40
  max-line-length: 40
  scoreboard-enabled: true
  tab-enabled: true

scoreboard:
  smp:
    title: "&5&lVOIDFLAME SMP"
    lines:
      - "&8&m--------------------"
      - "&fBalance: &a$%balance%"
      - "&fShards: &d%shards%"
      - " "
      - "&fKills: &a%kills%"
      - "&fDeaths: &c%deaths%"
      - "&fPlaytime: &b%playtime%"
      - " "
      - "&fOnline: &d%server_online%"
      - "&8&m--------------------"
      - "&dplay.VoidFlame.net"

tab:
  header: "&5&lVOIDFLAME MC &8• &dSMP"
  footer: "&8» &fOnline &d%server_online% &8• &fPing &a%player_ping%ms &8• &dplay.VoidFlame.net"
